<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect width="800" height="380" rx="16" fill="#0d1117" stroke="#30363d"/>

  <!-- CPU -->
  <rect x="40" y="40" width="250" height="220" rx="12" fill="#161b22" stroke="#00e5ff" stroke-width="2"/>
  <text x="165" y="66" text-anchor="middle" fill="#00e5ff" font-size="18" font-weight="bold">CPU</text>
  <g font-size="13" fill="#c9d1d9">
    <rect x="60" y="82" width="210" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="72" y="102">RIP</text><text x="262" y="102" text-anchor="end" fill="#7ee787">0x401136</text>
    <rect x="60" y="120" width="210" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="72" y="140">EAX</text><text x="262" y="140" text-anchor="end" fill="#ffa657">0x0000002A</text>
    <rect x="60" y="158" width="210" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="72" y="178">RSP</text><text x="262" y="178" text-anchor="end" fill="#d2a8ff">0x7ffe1c40</text>
    <rect x="60" y="200" width="210" height="40" rx="6" fill="#0d1117" stroke="#00e5ff" stroke-dasharray="4 3"/>
    <text x="165" y="225" text-anchor="middle" fill="#00e5ff">ALU · add eax, 5</text>
  </g>
  <rect x="60" y="82" width="210" height="30" rx="6" fill="none" stroke="#7ee787" stroke-width="2">
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- RAM -->
  <rect x="510" y="40" width="250" height="220" rx="12" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
  <text x="635" y="66" text-anchor="middle" fill="#ff7b72" font-size="18" font-weight="bold">RAM</text>
  <g font-size="13" fill="#c9d1d9">
    <rect x="530" y="82" width="210" height="48" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="542" y="102" fill="#8b949e">Code (.text)</text>
    <text x="542" y="120" fill="#7ee787">mov eax,[rbp-4]</text>
    <rect x="530" y="138" width="210" height="48" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="542" y="158" fill="#8b949e">Heap  ↑ grows up</text>
    <text x="542" y="176" fill="#ffa657">malloc'd objects</text>
    <rect x="530" y="194" width="210" height="48" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="542" y="214" fill="#8b949e">Stack ↓ grows down</text>
    <text x="542" y="232" fill="#d2a8ff">[rbp-4] = 0x2A</text>
  </g>

  <!-- Bus -->
  <line x1="510" y1="106" x2="292" y2="106" stroke="#6e7681" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <line x1="292" y1="206" x2="508" y2="206" stroke="#6e7681" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="400" y="96" text-anchor="middle" fill="#8b949e" font-size="12">fetch instruction</text>
  <text x="400" y="226" text-anchor="middle" fill="#8b949e" font-size="12">store result</text>
  <line x1="508" y1="156" x2="292" y2="156" stroke="#6e7681" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="400" y="146" text-anchor="middle" fill="#8b949e" font-size="12">load data</text>

  <!-- Moving signals -->
  <circle r="6" fill="#7ee787">
    <animateMotion path="M510,106 L292,106" dur="2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle r="6" fill="#d2a8ff">
    <animateMotion path="M508,156 L292,156" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle r="6" fill="#ffa657">
    <animateMotion path="M292,206 L508,206" dur="2s" repeatCount="indefinite" begin="2s"/>
  </circle>

  <!-- Pipeline stages -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="40" y="290" width="170" height="44" rx="8" fill="#7ee787" fill-opacity="0.15" stroke="#7ee787">
      <animate attributeName="opacity" values="1;0.3;0.3;0.3;1" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="318" fill="#7ee787">1 · FETCH</text>
    <rect x="224" y="290" width="170" height="44" rx="8" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff">
      <animate attributeName="opacity" values="0.3;1;0.3;0.3;0.3" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="309" y="318" fill="#00e5ff">2 · DECODE</text>
    <rect x="408" y="290" width="170" height="44" rx="8" fill="#ffa657" fill-opacity="0.15" stroke="#ffa657">
      <animate attributeName="opacity" values="0.3;0.3;1;0.3;0.3" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="493" y="318" fill="#ffa657">3 · EXECUTE</text>
    <rect x="592" y="290" width="168" height="44" rx="8" fill="#d2a8ff" fill-opacity="0.15" stroke="#d2a8ff">
      <animate attributeName="opacity" values="0.3;0.3;0.3;1;0.3" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="676" y="318" fill="#d2a8ff">4 · WRITE BACK</text>
  </g>
  <text x="400" y="364" text-anchor="middle" fill="#8b949e" font-size="12">The instruction cycle: RIP points at the next instruction, the CPU fetches it from memory, decodes it, executes it, then stores the result.</text>
</svg>
